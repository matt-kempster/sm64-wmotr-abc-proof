name: build

# Type-check the whole proof tree on every push/PR. A red X here is the
# backstop against committing a non-compiling .v (the failure mode that the
# "never batch build with commit" rule guards against locally). Mirrors the
# pipeline/*.sh drivers exactly: same switch, same `make`.

on:
  push:
    branches: [ master ]
  pull_request:

# Cancel an in-flight run if a newer commit arrives on the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SM64_PROOF_SWITCH: sm64-proof
      OPAMCOLOR: never
      OPAMYES: "1"
      OPAMROOT: ${{ github.workspace }}/.opamroot
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (gmp for zarith -> coq-core)
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev opam

      # Cache the entire opam root (the sm64-proof switch with coq-compcert is
      # the expensive part -- many minutes to build from scratch). Key on the
      # installer + this workflow so a toolchain bump busts the cache.
      - name: Cache opam root
        id: opam-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.OPAMROOT }}
          key: opam-${{ runner.os }}-${{ hashFiles('pipeline/install-toolchain.sh', '.github/workflows/build.yml') }}

      - name: Init opam (first run only)
        run: opam init --bare --disable-sandboxing --no-setup || true

      - name: Build toolchain switch (cache miss only)
        if: steps.opam-cache.outputs.cache-hit != 'true'
        run: bash pipeline/install-toolchain.sh

      # The actual gate: full type-check of generated ASTs + all proofs.
      # NOTE: deliberately does NOT build the forbidden path in
      #   proofs/Generic/SymbolicLinking.v -- the file is in _CoqProject but only
      #   does a bounded single-program lookup; it never `link`s a whole program
      #   (that OOMs; see SymbolicLinking.v).
      # Build the proofs against the COMMITTED generated/*.v. We intentionally do
      # NOT regenerate (no `make all`): that needs the vendor/sm64 submodule +
      # clightgen, and we want CI to verify exactly the artifacts in the repo.
      - name: Build (proofs against committed generated/)
        run: bash pipeline/build.sh proofs

      # Structure check: enforce 'unused => unwired'. No file outside an Unwired/
      # subtree may import into it (firewall), and every non-Unwired file must be
      # reachable from a marked root (spine-root/kept) -- see pipeline/check_unwired.py.
      - name: Structure check (unused => unwired)
        run: python3 pipeline/check_unwired.py

      # Trust check: the headline theorems must rest only on CompCert's baseline
      # axioms (no stray Admitted / project axiom sneaking in). The capstone
      # list mirrors discipline_check.sh's default: the LIVE GOAL-1 capstones
      # are the four NoAImpliesNoFlyLinked theorems over the linked program lp
      # (the old NoAImpliesNoFly.NoAImpliesNoFly capstone was demoted to
      # Unwired/NoAImpliesNoFlyVacuous.v in the 2026-06-03 re-root).
      - name: Axiom check (headline theorems)
        run: |
          bash pipeline/assumptions.sh SM64.Proofs.NoAImpliesNoFly.NoAImpliesNoFlyLinked noA_no_spawn_never_flying_lp
          bash pipeline/assumptions.sh SM64.Proofs.NoAImpliesNoFly.NoAImpliesNoFlyLinked noA_no_spawn_never_flying_real
          bash pipeline/assumptions.sh SM64.Proofs.NoAImpliesNoFly.NoAImpliesNoFlyLinked noA_no_spawn_never_flying_real_v2
          bash pipeline/assumptions.sh SM64.Proofs.NoAImpliesNoFly.NoAImpliesNoFlyLinked noA_no_spawn_never_flying_real_mwf
          bash pipeline/assumptions.sh SM64.Proofs.MarioModel.ActionValueFrame exec_stmt_value_preserves
          bash pipeline/assumptions.sh SM64.Proofs.Generic.SymbolicLinking linked_resolves_act_flying
